
submit: true
job_flavour: workday

chunk_size: 1        # files per job
target_chunk_size_gb: 5.0
max_files_per_chunk: 5
max_files: -1        # -1 = all files
use_ext: false     # if true, use all nanoAOD paths in each list; otherwise only the first


# ---------------------------------------------------------
# condor configuration
# ---------------------------------------------------------

request_cpus: 1
request_memory: 4GB
request_disk: 2GB

# ---------------------------------------------------------
# optional controls
# ---------------------------------------------------------

# run only subset of datasets (optional override)
datasets_whitelist: []

# debug mode
dryrun: false


process_to_select:
  - Data_Muon
  - DY
  - DYto2Mu_MLL105To160
  - TT
  - W_NJets
  - EWK
  - EWK_2Mu2J_MLL_105to160_herwig
  - EWK_2Mu2J_MLL_105to160_pythia
  - SingleH
  - VV
  - VVV
  - ST
  - TW
  - TTX
  - VBFHto2Mu_M125_amcatnlo
  - VBFHto2Mu_M125_powheg
  - GluGluHto2Mu
  - GluGluHto2Mu_amcatnlo
  - GluGluHto2Mu


