  variations:
    - {name: "QCD_ren_scale_{process}", down: "muR0p5_muF1", up: "muR2_muF1"}
    - {name: "QCD_fac_scale_{process}", down: "muR1_muF0p5", up: "muR1_muF2"}
  points:
    - {name: "muR0p5_muF0p5", index: 0}
    - {name: "muR0p5_muF1", index: 1}
    - {name: "muR1_muF0p5", index: 3}
    - {name: "muR1_muF2", index: 5}
    - {name: "muR2_muF1", index: 7}
    - {name: "muR2_muF2", index: 8}

derived_systematics:
  EWKHerwigPythia:
    name: "CMS_hmm_EWKZ_partonShower_{era}"
    isCorrelated: false
    nominal_process: "EWK_2Mu2J_MLL_105to160_herwig"
    alternative_process: "EWK_2Mu2J_MLL_105to160_pythia"
    coefficient: 0.5
    floor: 0.0
  VBFHHerwigPythia:
    # No powheg+herwig7 sample in this era: the 2024 variation
    # 0.5 |pythia - herwig|, scaled by lumi(era)/lumi(2024), is added to and
    # subtracted from the powheg+pythia nominal of this era.
    name: "CMS_hmm_VBFH_partonShower"
    isCorrelated: true
    Eras_correlated: all
    reference_era: "Run3_2024"
    nominal_process: "VBFHto2Mu_M125_powheg_herwig"
    alternative_process: "VBFHto2Mu_M125_powheg"
    target_process: "VBFHto2Mu_M125_powheg"
    card_process: "VBFHto2Mu_M125_powheg"
    scale: "lumi"
    coefficient: 0.5
    floor: 0.0
  EWKInclusiveHerwigPythia:
    # Inclusive EWK Z: no private herwig/pythia pair in this era, the 2024 shift
    # scaled by lumi(era)/lumi(2024) (as for the VBF H parton shower).
    name: "CMS_hmm_EWKZ_partonShower_{era}"
    isCorrelated: false
    reference_era: "Run3_2024"
    nominal_process: "EWK_LLJJ_herwig"
    alternative_process: "EWK_LLJJ_pythia"
    target_process: "EWK"
    card_process: ["EWK_2Mu2J_MLL_105to160_herwig", "EWK"]
    scale: "lumi"
    coefficient: 0.5
    floor: 0.0

