    W_NJets: "V"
    TT: "ttbar"
    TTto2L2Nu_Flashsim: "ttbar"
    ST: "ttbar"
    TW: "ttbar"
    TTX: "ttbar"
    EWK: "V"
    EWK_LLJJ_herwig: "V"
    EWK_LLJJ_pythia: "V"
    EWK_LLJJ_MLL50_herwig7_private: "V"
    EWK_LLJJ_MLL50_pythia8_private: "V"
    EWK_2Mu2J_MLL_105to160_herwig: "V"
    EWK_2Mu2J_MLL_105to160_pythia: "V"
    EWK_2Mu2J_MLL_105to160_pythia_Flashsim: "V"
    VV: "VV"
    VV_Inclusive: "VV"
    VVV: "VVV"
    VBFHto2Mu_M125_amcatnlo: "qqH"
    VBFHto2Mu_M125_powheg: "qqH"
    VBFHto2Mu_M125_powheg_herwig: "qqH"
    VBFHto2Mu_m125_Flashsim: "qqH"
    VBFHto2Mu_m120: "qqH"
    VBFHto2Mu_m130: "qqH"
    VBFHto2Mu_m125_tuneDown: "qqH"
    VBFHto2Mu_m125_tuneUp: "qqH"
