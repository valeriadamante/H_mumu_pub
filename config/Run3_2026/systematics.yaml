weights:
  # 2026: muon ID/isolation/trigger scale factors of 2025 (decision of 2026-10-08).
  # The skims have no SF columns: common/prepare_rdf.define_missing_muon_sfs computes
  # them from the muon columns with the 2025 payload (maincfg.yaml: muon_sf_era).
  Central:
    name: ""
    muon_suffix: ""
    jet_suffix: ""
    weight: "weight__Central"
    expression: >
      genWeight *
      weight_lumi *
      weight_xs *
      weight_pu *
      ((mu1_pt < 30) ? weight_mu1_TightPFIso_TightID_Central : weight_mu1_LoosePFIso_MediumID_Central) *
      ((mu1_pt < 30) ? weight_mu1_TightID_Trk_Central : weight_mu1_MediumID_Trk_Central) *
      ((mu2_pt < 30) ? weight_mu2_TightPFIso_TightID_Central : weight_mu2_LoosePFIso_MediumID_Central) *
      ((mu2_pt < 30) ? weight_mu2_TightID_Trk_Central : weight_mu2_MediumID_Trk_Central) *
      weight_TrgSF_singleMu_IsoMu24Central

  # QCD renormalization/factorization scales: unnormalized 6-point envelope.
  QCDScale_{scale}:
    jet_suffix: ""
    muon_suffix: ""
    name: "QCDscale_{process}"
    isCorrelated: true
    Eras_correlated: all
    weight: "weight__QCDScale_{scale}"
    derived_envelope: true

  # PDF replica RMS; alphaS weights are intentionally excluded.
  PDF_{scale}:
    jet_suffix: ""
    muon_suffix: ""
    name: "pdf_{pdf_process}"
    isCorrelated: true
    Eras_correlated: all
    weight: "weight__PDF_{scale}"
    relative_expression: "weight_pdf_{scale}"

  # ========================================
  # Pileup
  # ========================================

  PU_{scale}:
    jet_suffix: ""
    muon_suffix: ""
    name: "CMS_pileup_{era}"
    isCorrelated: false
    weight: "weight__PU_{scale}"
    expression: >
      genWeight *
      weight_lumi *
      weight_xs *
      weight_pu_{scale} *
      ((mu1_pt < 30) ? weight_mu1_TightPFIso_TightID_Central : weight_mu1_LoosePFIso_MediumID_Central) *
      ((mu1_pt < 30) ? weight_mu1_TightID_Trk_Central : weight_mu1_MediumID_Trk_Central) *
      ((mu2_pt < 30) ? weight_mu2_TightPFIso_TightID_Central : weight_mu2_LoosePFIso_MediumID_Central) *
      ((mu2_pt < 30) ? weight_mu2_TightID_Trk_Central : weight_mu2_MediumID_Trk_Central) *
      weight_TrgSF_singleMu_IsoMu24Central

  # ========================================
  # Muon ID/Iso
  # ========================================

  MuonID_{scale}:
    jet_suffix: ""
    muon_suffix: ""
    name: "CMS_eff_m_id_{era}"
    isCorrelated: false
    weight: "weight__MuonID_{scale}"
    expression: >
      genWeight *
      weight_lumi *
      weight_xs *
      weight_pu *
      ((mu1_pt < 30) ? weight_mu1_TightPFIso_TightID_Central : weight_mu1_LoosePFIso_MediumID_Central) *
      ((mu1_pt < 30) ? weight_mu1_TightID_Trk_{scale} : weight_mu1_MediumID_Trk_{scale}) *
      ((mu2_pt < 30) ? weight_mu2_TightPFIso_TightID_Central : weight_mu2_LoosePFIso_MediumID_Central) *
      ((mu2_pt < 30) ? weight_mu2_TightID_Trk_{scale} : weight_mu2_MediumID_Trk_{scale}) *
      weight_TrgSF_singleMu_IsoMu24Central

  MuonIso_{scale}:
    jet_suffix: ""
    muon_suffix: ""
    name: "CMS_eff_m_iso_{era}"
    isCorrelated: false
    weight: "weight__MuonIso_{scale}"
    expression: >
      genWeight *
      weight_lumi *
      weight_xs *
      weight_pu *
      ((mu1_pt < 30) ? weight_mu1_TightPFIso_TightID_{scale} : weight_mu1_LoosePFIso_MediumID_{scale}) *
      ((mu1_pt < 30) ? weight_mu1_TightID_Trk_Central : weight_mu1_MediumID_Trk_Central) *
      ((mu2_pt < 30) ? weight_mu2_TightPFIso_TightID_{scale} : weight_mu2_LoosePFIso_MediumID_{scale}) *
      ((mu2_pt < 30) ? weight_mu2_TightID_Trk_Central : weight_mu2_MediumID_Trk_Central) *
      weight_TrgSF_singleMu_IsoMu24Central

  # ========================================
  # Trigger
  # ========================================

  singleMuTrigger_{scale}:
    jet_suffix: ""
    muon_suffix: ""
    name: "CMS_eff_m_trigger_{era}"
    isCorrelated: false
    weight: "weight__singleMuTrigger_{scale}"
    expression: >
      genWeight *
      weight_lumi *
      weight_xs *
      weight_pu *
      ((mu1_pt < 30) ? weight_mu1_TightPFIso_TightID_Central : weight_mu1_LoosePFIso_MediumID_Central) *
      ((mu1_pt < 30) ? weight_mu1_TightID_Trk_Central : weight_mu1_MediumID_Trk_Central) *
      ((mu2_pt < 30) ? weight_mu2_TightPFIso_TightID_Central : weight_mu2_LoosePFIso_MediumID_Central) *
      ((mu2_pt < 30) ? weight_mu2_TightID_Trk_Central : weight_mu2_MediumID_Trk_Central) *
      weight_TrgSF_singleMu_IsoMu24{scale}
