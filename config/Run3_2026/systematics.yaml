derived_systematics:
  EWKHerwigPythia:
    name: "CMS_hmm_EWKZ_partonShower"
    isCorrelated: true
    Eras_correlated: all
    nominal_process: "EWK_2Mu2J_MLL_105to160_herwig"
    alternative_process: "EWK_2Mu2J_MLL_105to160_pythia"
    coefficient: 0.5
    floor: 0.0
  VBFHHerwigPythia:
    # VBF H parton shower: powheg+herwig7 is the nominal where it exists,
    # Up/Down = herwig +- 0.5 |pythia - herwig|; one nuisance for every era.
    name: "CMS_hmm_VBFH_partonShower"
    isCorrelated: true
    Eras_correlated: all
    nominal_process: "VBFHto2Mu_M125_powheg_herwig"
    alternative_process: "VBFHto2Mu_M125_powheg"
    card_process: "VBFHto2Mu_M125_powheg"
    coefficient: 0.5
    floor: 0.0
  EWKInclusiveHerwigPythia:
    # Inclusive EWK Z (Z sideband, Signal_ext, mass_inclusive): the official
    # herwig sample gets the shift 0.5 |pythia - herwig| of the private pair of
    # the same gridpack.  Same nuisance as the 105-160 one (EWKHerwigPythia).
    name: "CMS_hmm_EWKZ_partonShower"
    isCorrelated: true
    Eras_correlated: all
    nominal_process: "EWK_LLJJ_herwig"
    alternative_process: "EWK_LLJJ_pythia"
    target_process: "EWK"
    card_process: ["EWK_2Mu2J_MLL_105to160_herwig", "EWK"]
    coefficient: 0.5
    floor: 0.0

