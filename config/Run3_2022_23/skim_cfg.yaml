
submit: true
job_flavour: workday

chunk_size: 1        # files per job
target_chunk_size_gb: 5.0
max_files_per_chunk: 5
max_files: -1        # -1 = all files


# ---------------------------------------------------------
# condor configuration
# ---------------------------------------------------------

request_cpus: 1
request_memory: 4GB
request_disk: 2GB

# ---------------------------------------------------------
# optional controls
# ---------------------------------------------------------

# run only subset of datasets (optional override)
datasets_whitelist: []
  # - Muon_Run2022C
#   - Muon_Run2022D

# debug mode
dryrun: false


