# Jet occupancy maps for the horn-veto study (hmumu hist jet_horn_veto
# --variables ...). SelectedJet_* are collections: every selected jet fills
# the map with the event weight. eta bins of 0.1, phi bins of 2pi/72.
eta_phi_selectedjets:
  var_list: [SelectedJet_eta, SelectedJet_phi]
  SelectedJet_eta_bins: "94|-4.7:4.7"
  SelectedJet_phi_bins: "72|-3.14159265:3.14159265"
  x_title: "$\\eta(j)$"
  y_title: "$\\phi(j)$"

eta_phi_leadingjet:
  var_list: [leadingjet_eta, leadingjet_phi]
  leadingjet_eta_bins: "94|-4.7:4.7"
  leadingjet_phi_bins: "72|-3.14159265:3.14159265"
  x_title: "$\\eta(j_1)$"
  y_title: "$\\phi(j_1)$"

eta_phi_vbfjet1:
  var_list: [vbfjet1_eta, vbfjet1_phi]
  vbfjet1_eta_bins: "94|-4.7:4.7"
  vbfjet1_phi_bins: "72|-3.14159265:3.14159265"
  x_title: "$\\eta(j^{VBF}_1)$"
  y_title: "$\\phi(j^{VBF}_1)$"

eta_phi_vbfjet2:
  var_list: [vbfjet2_eta, vbfjet2_phi]
  vbfjet2_eta_bins: "94|-4.7:4.7"
  vbfjet2_phi_bins: "72|-3.14159265:3.14159265"
  x_title: "$\\eta(j^{VBF}_2)$"
  y_title: "$\\phi(j^{VBF}_2)$"

# DY reco/gen-jet component fits.  The x axis carries eta so the fit can
# determine independent pT scales in central/forward regions.
eta_vs_pt_leadingjet:
  var_list: [abs_leadingjet_eta, leadingjet_pt]
  abs_leadingjet_eta_bins: [0.0, 1.0, 1.5, 2.0, 2.5, 2.7, 3.0, 3.5, 4.0, 4.7]
  leadingjet_pt_bins: [25, 35, 45, 80, 100, 200]
  x_title: "$|\\eta(j_1)|$"
  y_title: "$p_T(j_1)$ (GeV)"

eta_signed_vs_pt_leadingjet:
  var_list: [leadingjet_eta, leadingjet_pt]
  leadingjet_eta_bins: [-4.7, -4.0, -3.5, -3.0, -2.7, -2.5, -2.0, -1.5, -1.0, 0.0, 1.0, 1.5, 2.0, 2.5, 2.7, 3.0, 3.5, 4.0, 4.7]
  leadingjet_pt_bins: [25, 35, 45, 80, 100, 200]
  x_title: "$\\eta(j_1)$"
  y_title: "$p_T(j_1)$ (GeV)"

eta_vs_pt_subleadingjet:
  var_list: [abs_subleadingjet_eta, subleadingjet_pt]
  abs_subleadingjet_eta_bins: [0.0, 1.0, 1.5, 2.0, 2.5, 2.7, 3.0, 3.5, 4.0, 4.7]
  subleadingjet_pt_bins: [25, 35, 45, 80, 100, 200]
  x_title: "$|\\eta(j_2)|$"
  y_title: "$p_T(j_2)$ (GeV)"

eta_signed_vs_pt_subleadingjet:
  var_list: [subleadingjet_eta, subleadingjet_pt]
  subleadingjet_eta_bins: [-4.7, -4.0, -3.5, -3.0, -2.7, -2.5, -2.0, -1.5, -1.0, 0.0, 1.0, 1.5, 2.0, 2.5, 2.7, 3.0, 3.5, 4.0, 4.7]
  subleadingjet_pt_bins: [25, 35, 45, 80, 100, 200]
  x_title: "$\\eta(j_2)$"
  y_title: "$p_T(j_2)$ (GeV)"

# VBF DY-component fit: use the first jet of the selected VBF pair.  The fit
